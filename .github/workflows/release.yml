# Builds and publishes the Harpo image to Docker Hub.
#
# Triggers on version tags (v0.1.0 → tags 0.1.0, 0.1 and latest) and can be run
# manually from the Actions tab (publishes a `main` tag for testing).
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — Docker Hub account name
#   DOCKERHUB_TOKEN    — a Docker Hub access token with Read & Write scope
#     (hub.docker.com → Account settings → Personal access tokens)
#
# Forks: also change IMAGE below to your own namespace.
#
# Every action is pinned to a full commit SHA, with the version it corresponds
# to alongside. A tag such as @v4 can be moved to different code by whoever
# controls that repository; this job holds the Docker Hub token, so what runs
# here should only change when someone here changes it. To update one: pick the
# release, resolve its tag to a commit
#   gh api repos/OWNER/REPO/git/ref/tags/vX.Y.Z --jq .object.sha
# (if that object is an annotated tag, resolve once more via git/tags/SHA) and
# replace both the SHA and the comment.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ryanjkendrick/harpo

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: dotnet test
        run: dotnet test Harpo.slnx --configuration Release

  publish:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU lets the runner assemble the arm64 variant; the .NET compile itself
      # runs natively on the runner (the Dockerfile build stage is pinned to
      # $BUILDPLATFORM and produces architecture-neutral output).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
